# The toolbox is no WarpEngine game: its pipeline lives here. Every push checks it; a
# vX.Y.Z tag packages it and attaches the VSIX to the Gitea release; Open VSX joins when
# its token exists as a secret (ovsx_pat, as OVSX_PAT under the release step). The Visual
# Studio Marketplace is published by the GitHub mirror's Actions (Trusted Publishing,
# .github/workflows/publish.yml), which the same tag starts there.
when:
  - event: [push, manual]
    branch: master
  - event: tag

steps:
  - name: check
    image: node:22-bookworm-slim
    commands:
      - npm ci --no-audit --no-fund
      - npm run typecheck
      - npm run lint
      - npm test
      - npm run package

  - name: release
    image: node:22-bookworm-slim
    environment:
      GITEA_TOKEN:
        from_secret: gitea_token
    commands:
      - apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
      - scripts/ci-release.sh
    when:
      - event: tag
