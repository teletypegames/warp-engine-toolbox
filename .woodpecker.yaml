# The toolbox is no WarpEngine game: its pipeline lives here. Every push checks it; a
# vX.Y.Z tag packages it, attaches the VSIX to the Gitea release and publishes it to Open VSX
# (the ovsx_pat secret, tag events only). The Visual
# Studio Marketplace is published by the GitHub mirror's Actions (Trusted Publishing,
# .github/workflows/publish.yml), which the same tag starts there.
when:
  - event: [push, manual]
    branch: master
  - event: tag

steps:
  - name: check
    image: node:22-bookworm-slim
    commands:
      - npm ci --no-audit --no-fund
      - npm run typecheck
      - npm run lint
      - npm run docs:check
      - npm test
      - npm run package

  - name: publish-typedoc
    image: node:22-bookworm-slim
    depends_on: [check]
    environment:
      GITEA_TOKEN:
        from_secret: gitea_token
    commands:
      - apt-get update -qq && apt-get install -y -qq curl ca-certificates git >/dev/null
      - scripts/ci-typedoc.sh
    when:
      - event: tag
        ref: refs/tags/v*

  - name: release
    depends_on: [check]
    image: node:22-bookworm-slim
    environment:
      GITEA_TOKEN:
        from_secret: gitea_token
      OVSX_PAT:
        from_secret: ovsx_pat
    commands:
      - apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
      - scripts/ci-release.sh
    when:
      - event: tag
